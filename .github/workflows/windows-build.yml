name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache WinLibs
        id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\\winlibs
          key: ${{ runner.os }}-${{ env.WINLIBS_ZIP }}

      - name: Install WinLibs GCC 15.2
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$env:WINLIBS_RELEASE/$env:WINLIBS_ZIP"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\\winlibs.zip"
          7z x "$env:RUNNER_TEMP\\winlibs.zip" "-oC:\\winlibs" | Out-Null

      - name: Add toolchain to PATH
        shell: pwsh
        run: '"C:\\winlibs\\mingw64\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Configure
        shell: cmd
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++

      - name: Build
        shell: cmd
        run: cmake --build build --parallel 4

      - name: Full Windows test suite
        shell: cmd
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, dist\\libs | Out-Null
          Copy-Item build\\core\\relinker\\relinker.exe dist\\
          Copy-Item build\\core\\relinker\\AnyPS5.exe dist\\
          Copy-Item build\\core\\libs\\libs\\*.prx dist\\libs\\
          Copy-Item C:\\winlibs\\mingw64\\bin\\libgcc_s_seh-1.dll dist\\libs\\
          Copy-Item C:\\winlibs\\mingw64\\bin\\libstdc++-6.dll dist\\libs\\
          Copy-Item C:\\winlibs\\mingw64\\bin\\libwinpthread-1.dll dist\\libs\\
          @"
          AnyPS5 Windows build
          Commit: ${{ github.sha }}

          Double-click AnyPS5.exe for the graphical converter.
          relinker.exe remains available for command-line use and is called by the GUI.
          Keep AnyPS5.exe and relinker.exe together.
          Put the contents of libs next to the relinked game executable when running a translated title.
          "@ | Set-Content dist\\README-Windows.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: AnyPS5-Windows-${{ github.sha }}
          path: dist
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
